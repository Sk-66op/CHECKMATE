name: Build Checkmate Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Checkmate APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare files (extract ZIP if exists)
        run: |
          echo "=== Current structure ==="
          ls -la
          
          ZIP_FILE=$(find . -name "*.zip" | head -1)
          if [ -n "$ZIP_FILE" ]; then
            echo "✅ Found ZIP file: $ZIP_FILE"
            unzip -o "$ZIP_FILE"
            for dir in */; do
              if [ -f "${dir}main.py" ] || [ -f "${dir}buildozer.spec" ]; then
                echo "Found project files in: $dir"
                cp -r "${dir}"* .
              fi
            done
          fi
          
          echo ""
          echo "=== Final structure ==="
          ls -la
          echo ""
          echo "=== Checking for buildozer.spec ==="
          find . -name "buildozer.spec"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev gettext autopoint \
            openjdk-17-jdk python3-dev build-essential \
            wget

      - name: Install Android SDK with specific build tools
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p $ANDROID_HOME
          
          cd $ANDROID_HOME
          
          # Download command-line tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          rm commandlinetools-linux-11076708_latest.zip
          
          # Create correct directory structure
          mkdir -p cmdline-tools
          mv cmdline-tools cmdline-tools/latest 2>/dev/null || true
          
          # If the above failed, try alternative
          if [ ! -f "cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p cmdline-tools/latest
            mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
          fi
          
          # Accept all licenses automatically
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          
          # Install specific versions
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3"
          
          # Set environment variables
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/build-tools/30.0.3" >> $GITHUB_PATH
          
          echo "✅ Android SDK installed successfully!"

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython

      - name: Build APK
        run: |
          SPEC_DIR=$(find . -name "buildozer.spec" -exec dirname {} \; | head -1)
          if [ -z "$SPEC_DIR" ]; then
            echo "❌ buildozer.spec not found!"
            exit 1
          fi
          echo "Building in: $SPEC_DIR"
          cd "$SPEC_DIR"
          
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          
          # Build with verbose output
          buildozer -v android debug
        timeout-minutes: 50

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Checkmate-debug-apk
          path: |
            **/bin/*.apk
          if-no-files-found: error
