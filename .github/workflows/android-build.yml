name: Build CHECKMATE Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # --------------------------------------------------
      # 1. CHECKOUT
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. EXTRACT CHECKMATE PROJECT
      # --------------------------------------------------
      - name: Extract CHECKMATE project
        shell: bash
        run: |
          set -e

          echo "=== Repository contents ==="
          ls -la

          # Find ZIP files in repository root
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1 || true)

          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP: $ZIP_FILE"

            mkdir -p extracted
            unzip -o "$ZIP_FILE" -d extracted

            echo "=== Extracted contents ==="
            find extracted -maxdepth 4 -type f | head -200
          else
            echo "No ZIP found. Using repository files directly."
          fi


      # --------------------------------------------------
      # 3. LOCATE buildozer.spec
      # --------------------------------------------------
      - name: Locate CHECKMATE project
        shell: bash
        run: |
          set -e

          echo "Searching for buildozer.spec..."

          SPEC_FILE=$(find . \
            -type f \
            -name "buildozer.spec" \
            -not -path "*/.buildozer/*" \
            -not -path "*/.venv/*" \
            | head -n 1)

          if [ -z "$SPEC_FILE" ]; then
            echo "ERROR: buildozer.spec was not found."
            echo "Full project tree:"
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SPEC_FILE")
          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "Found buildozer.spec:"
          echo "$SPEC_FILE"

          echo "CHECKMATE project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=== Project contents ==="
          ls -la "$PROJECT_DIR"


      # --------------------------------------------------
      # 4. CLEAN UNNECESSARY FILES
      # --------------------------------------------------
      - name: Clean project
        shell: bash
        run: |
          set -e

          echo "Cleaning unnecessary files..."

          # Remove Windows/local virtual environment
          rm -rf "$PROJECT_DIR/.venv"
          rm -rf "$PROJECT_DIR/venv"

          # Remove Python cache
          find "$PROJECT_DIR" -type d -name "__pycache__" -prune -exec rm -rf {} +

          # Remove previous Android/build output
          rm -rf "$PROJECT_DIR/.buildozer"
          rm -rf "$PROJECT_DIR/bin"

          # Remove git metadata if present inside ZIP
          rm -rf "$PROJECT_DIR/.git"

          echo "Cleaning complete."

          echo "=== Final project contents ==="
          find "$PROJECT_DIR" -maxdepth 2 -type f | sort


      # --------------------------------------------------
      # 5. SETUP PYTHON
      # --------------------------------------------------
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # --------------------------------------------------
      # 6. SETUP JAVA 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # --------------------------------------------------
      # 7. INSTALL SYSTEM DEPENDENCIES
      # --------------------------------------------------
      - name: Install system dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential


      # --------------------------------------------------
      # 8. INSTALL BUILD TOOLS
      # --------------------------------------------------
      - name: Install Buildozer
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "cython==0.29.33" \
            "buildozer==1.4.0"

          echo "=== Versions ==="
          python --version
          java -version
          buildozer --version


      # --------------------------------------------------
      # 9. INSTALL ANDROID SDK CLEANLY
      # --------------------------------------------------
      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME"

          # Completely remove potentially broken SDK
          rm -rf "$ANDROID_HOME"

          mkdir -p "$ANDROID_HOME/cmdline-tools"

          # Work in temporary directory
          cd "$RUNNER_TEMP"

          rm -rf android-cmdline-tools
          rm -f commandlinetools.zip

          echo "Downloading Android command line tools..."

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip" \
            -O commandlinetools.zip

          echo "Extracting command line tools..."

          mkdir android-cmdline-tools

          unzip -q commandlinetools.zip \
            -d android-cmdline-tools

          # IMPORTANT:
          # Move extracted cmdline-tools into latest.
          # We do NOT create/move cmdline-tools into itself.
          mv \
            android-cmdline-tools/cmdline-tools \
            "$ANDROID_HOME/cmdline-tools/latest"

          echo "=== sdkmanager ==="

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

          # Add SDK tools to PATH
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"


      # --------------------------------------------------
      # 10. ACCEPT ANDROID LICENSES
      # --------------------------------------------------
      - name: Accept Android licenses
        shell: bash
        run: |
          set -e

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --licenses > /dev/null || true


      # --------------------------------------------------
      # 11. INSTALL ANDROID COMPONENTS INCLUDING AIDL
      # --------------------------------------------------
      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          echo "Installing Android SDK..."

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25b"

          echo "=== Android SDK installed ==="

          echo "Build Tools:"
          ls -la "$ANDROID_HOME/build-tools/34.0.0"

          echo "AIDL:"
          ls -la "$ANDROID_HOME/build-tools/34.0.0/aidl"


      # --------------------------------------------------
      # 12. VERIFY AIDL
      # --------------------------------------------------
      - name: Verify AIDL
        shell: bash
        run: |
          set -e

          AIDL="$ANDROID_HOME/build-tools/34.0.0/aidl"

          echo "Checking AIDL..."

          if [ ! -f "$AIDL" ]; then
            echo "ERROR: AIDL was not installed."
            exit 1
          fi

          if [ ! -x "$AIDL" ]; then
            echo "ERROR: AIDL is not executable."
            exit 1
          fi

          echo "AIDL exists:"
          ls -lh "$AIDL"

          echo "Running AIDL:"
          "$AIDL" --version || true

          echo "AIDL verification PASSED."


      # --------------------------------------------------
      # 13. CONFIGURE SDK ENVIRONMENT
      # --------------------------------------------------
      - name: Configure Android environment
        shell: bash
        run: |
          set -e

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "PATH=$PATH"

          echo "=== SDK packages ==="

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --list_installed || true


      # --------------------------------------------------
      # 14. SHOW CURRENT BUILDOSER CONFIG
      # --------------------------------------------------
      - name: Check buildozer.spec
        shell: bash
        run: |
          set -e

          echo "=== buildozer.spec ==="

          cat "$PROJECT_DIR/buildozer.spec"


      # --------------------------------------------------
      # 15. BUILD CHECKMATE
      # --------------------------------------------------
      - name: Build CHECKMATE APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "=========================================="
          echo "        CHECKMATE ANDROID BUILD"
          echo "=========================================="

          echo "Project:"
          pwd

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "AIDL:"
          "$ANDROID_HOME/build-tools/34.0.0/aidl" --version || true

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "Cleaning Buildozer cache..."

          rm -rf "$HOME/.buildozer"
          rm -rf ".buildozer"
          rm -rf "bin"

          echo ""
          echo "Starting Buildozer..."

          yes | buildozer android debug


      # --------------------------------------------------
      # 16. SHOW GENERATED APK
      # --------------------------------------------------
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          find "$PROJECT_DIR/bin" \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find "$PROJECT_DIR/bin" \
            -type f \
            -name "*.apk" \
            | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo "APK generated successfully."


      # --------------------------------------------------
      # 17. UPLOAD APK
      # --------------------------------------------------
      - name: Upload CHECKMATE APK
        uses: actions/upload-artifact@v4
        with:
          name: CHECKMATE-APK
          path: ${{ env.PROJECT_DIR }}/bin/*.apk
          if-no-files-found: error
