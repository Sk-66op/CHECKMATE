name: Build ChessAI Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ChessAI source
        run: |
          unzip -o ChessAI_CHECKMATE_resolved.zip
          ls -la
          ls -la ChessAI

          echo "Configuring Buildozer..."

          sed -i '/^\[app\]/a android.accept_sdk_license = True' ChessAI/buildozer.spec

          echo "Final Buildozer configuration:"
          grep -E "requirements|p4a.branch|android.api|android.ndk|android.accept_sdk_license" ChessAI/buildozer.spec || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

          echo "ANDROIDSDK=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/33.0.2" >> "$GITHUB_PATH"

          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo "Checking AIDL..."

          test -x "$ANDROID_HOME/build-tools/33.0.2/aidl"

          echo "AIDL found successfully!"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install "cython==0.29.34"

      - name: Verify Build Environment
        run: |
          echo "======================================"
          echo "Java:"
          java -version

          echo "======================================"
          echo "Python:"
          python --version

          echo "======================================"
          echo "Buildozer:"
          buildozer --version

          echo "======================================"
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo "======================================"
          echo "AIDL:"
          "$ANDROID_HOME/build-tools/33.0.2/aidl" 2>&1 | head -20 || true

          echo "======================================"
          echo "Build environment verified."

      - name: Clean previous Android build
        working-directory: ChessAI
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        working-directory: ChessAI
        run: |
          export ANDROIDSDK="$ANDROID_HOME"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/33.0.2:$PATH"

          echo "Starting Buildozer Android build..."

          buildozer android debug

      - name: List generated APK
        if: success()
        working-directory: ChessAI
        run: |
          echo "Generated APK files:"
          ls -lah bin/

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ChessAI-debug-APK
          path: ChessAI/bin/*.apk
          if-no-files-found: error