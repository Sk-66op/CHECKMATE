name: Build Checkmate Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "ChessAI/**"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    name: Build Checkmate APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Debug step - run in root, NOT in ChessAI
      - name: Debug directory structure
        run: |
          echo "Current directory: $(pwd)"
          echo "Listing all files:"
          ls -la
          echo ""
          echo "Checking if ChessAI exists:"
          if [ -d "ChessAI" ]; then
            echo "✅ ChessAI directory found!"
            echo "Contents of ChessAI:"
            ls -la ChessAI/
          else
            echo "❌ ChessAI directory NOT found!"
            echo "Available directories:"
            find . -type d -maxdepth 2
          fi
        # NO working-directory specified - runs in root

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            autopoint \
            openjdk-17-jdk \
            python3-dev \
            build-essential
        # NO working-directory - runs in root

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.5.0 cython==0.29.34
        # NO working-directory - runs in root

      - name: Verify ChessAI files
        run: |
          cd ChessAI
          echo "In ChessAI directory: $(pwd)"
          echo "Files:"
          ls -la
          echo ""
          echo "Checking for buildozer.spec:"
          if [ -f "buildozer.spec" ]; then
            echo "✅ buildozer.spec found!"
          else
            echo "❌ buildozer.spec NOT found!"
            exit 1
          fi
          echo ""
          echo "Checking for main.py:"
          if [ -f "main.py" ]; then
            echo "✅ main.py found!"
          else
            echo "❌ main.py NOT found!"
            exit 1
          fi

      - name: Build Checkmate APK
        run: |
          cd ChessAI
          buildozer -v android debug
        timeout-minutes: 45

      - name: Verify APK
        run: |
          if [ -d "ChessAI/bin" ]; then
            echo "APK files in ChessAI/bin:"
            ls -lh ChessAI/bin/
            if [ -n "$(find ChessAI/bin -name '*.apk' -print -quit)" ]; then
              echo "✅ APK found!"
            else
              echo "❌ No APK found!"
              exit 1
            fi
          else
            echo "❌ ChessAI/bin directory not found!"
            exit 1
          fi

      - name: Upload Checkmate APK
        uses: actions/upload-artifact@v4
        with:
          name: Checkmate-debug-apk
          path: ChessAI/bin/*.apk
          if-no-files-found: error
