name: Build CHECKMATE Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_VERSION: 25.2.9519653
      ANDROID_API: "31"
      ANDROID_MIN_API: "21"
      BUILD_TOOLS_VERSION: "35.0.0"

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. EXTRACT PROJECT ZIP
      # ==========================================================
      - name: Extract CHECKMATE project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "REPOSITORY CONTENTS"
          echo "=========================================="

          ls -la

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1 || true)

          if [ -n "$ZIP_FILE" ]; then
            echo "Project ZIP found:"
            echo "$ZIP_FILE"

            rm -rf extracted
            mkdir -p extracted

            unzip -o "$ZIP_FILE" -d extracted

            echo ""
            echo "Extraction complete."
          else
            echo "No project ZIP found."
            echo "Assuming project is already extracted."
          fi

      # ==========================================================
      # 3. LOCATE BUILDOZER PROJECT
      # ==========================================================
      - name: Locate CHECKMATE project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "LOCATING BUILDOZER PROJECT"
          echo "=========================================="

          SPEC=$(find . \
            -type f \
            -name "buildozer.spec" \
            -not -path "*/.buildozer/*" \
            -not -path "*/.venv/*" \
            -not -path "*/venv/*" \
            | head -n 1)

          if [ -z "$SPEC" ]; then
            echo "ERROR: buildozer.spec not found."

            echo ""
            echo "Available files:"
            find . -maxdepth 7 -type f | sort

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SPEC")
          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "Buildozer project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "Project contents:"
          ls -la "$PROJECT_DIR"

      # ==========================================================
      # 4. REMOVE PROJECT BUILD ARTIFACTS
      # ==========================================================
      - name: Clean project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CLEANING PROJECT"
          echo "=========================================="

          rm -rf "$PROJECT_DIR/.venv"
          rm -rf "$PROJECT_DIR/venv"
          rm -rf "$PROJECT_DIR/.buildozer"
          rm -rf "$PROJECT_DIR/bin"

          find "$PROJECT_DIR" \
            -type d \
            -name "__pycache__" \
            -prune \
            -exec rm -rf {} +

          echo "Project cleanup complete."

      # ==========================================================
      # 5. PYTHON 3.10
      # ==========================================================
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ==========================================================
      # 6. JAVA 17
      # ==========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================================
      # 7. INSTALL LINUX DEPENDENCIES
      # ==========================================================
      - name: Install system dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential

          echo "System dependencies installed."

      # ==========================================================
      # 8. LOCATE ANDROID SDKMANAGER
      # ==========================================================
      - name: Locate Android SDK tools
        shell: bash
        run: |
          set -e

          SDK_ROOT="$ANDROID_HOME"

          echo "=========================================="
          echo "ANDROID SDK"
          echo "=========================================="

          echo "SDK root:"
          echo "$SDK_ROOT"

          if [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK directory does not exist."
            exit 1
          fi

          SDKMANAGER=$(find "$SDK_ROOT" \
            -type f \
            -name "sdkmanager" \
            -print -quit 2>/dev/null || true)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager could not be found."

            echo ""
            echo "Searching SDK:"
            find "$SDK_ROOT" -maxdepth 5 -type f | sort | head -200

            exit 1
          fi

          SDKMANAGER_DIR=$(dirname "$SDKMANAGER")

          echo "sdkmanager:"
          echo "$SDKMANAGER"

          echo "SDKMANAGER_DIR=$SDKMANAGER_DIR" >> "$GITHUB_ENV"

          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"

          export PATH="$SDKMANAGER_DIR:$PATH"

          echo ""
          echo "sdkmanager version:"
          "$SDKMANAGER" --version

      # ==========================================================
      # 9. INSTALL EXACT ANDROID COMPONENTS
      # ==========================================================
      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          export PATH="$SDKMANAGER_DIR:$PATH"

          echo "=========================================="
          echo "INSTALLING ANDROID COMPONENTS"
          echo "=========================================="

          echo "Accepting licenses..."

          yes | sdkmanager --licenses >/dev/null || true

          echo ""
          echo "Installing:"

          echo "  platform-tools"
          echo "  platforms;android-31"
          echo "  build-tools;35.0.0"
          echo "  ndk;25.2.9519653"

          sdkmanager \
            "platform-tools" \
            "platforms;android-31" \
            "build-tools;35.0.0" \
            "ndk;25.2.9519653"

          echo ""
          echo "Android components installed."

      # ==========================================================
      # 10. VERIFY AIDL
      # ==========================================================
      - name: Verify AIDL
        shell: bash
        run: |
          set -e

          export PATH="$SDKMANAGER_DIR:$PATH"

          SDK_ROOT="$ANDROID_HOME"

          echo "=========================================="
          echo "VERIFYING AIDL"
          echo "=========================================="

          AIDL="$SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/aidl"

          if [ -z "$AIDL" ]; then
            echo "ERROR: AIDL was not installed."

            echo ""
            echo "Build Tools contents:"
            find "$SDK_ROOT/build-tools" \
              -maxdepth 3 \
              -type f \
              | sort

            exit 1
          fi

          AIDL_DIR=$(dirname "$AIDL")

          echo "AIDL found:"
          echo "$AIDL"

          echo ""
          echo "AIDL version:"
          aidl --help >/dev/null 2>&1 || true

          echo ""

          # Make AIDL permanently available to later steps.
          echo "$AIDL_DIR" >> "$GITHUB_PATH"

          echo "AIDL_DIR=$AIDL_DIR" >> "$GITHUB_ENV"

          export PATH="$AIDL_DIR:$PATH"

          echo "AIDL executable:"
          command -v aidl

          echo ""
          echo "AIDL verification successful."

      # ==========================================================
      # 11. CONFIGURE ANDROID ENVIRONMENT
      # ==========================================================
      - name: Configure Android environment
        shell: bash
        run: |
          set -e

          SDK_ROOT="$ANDROID_HOME"
          NDK_PATH="$SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
          BUILD_TOOLS_PATH="$SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION"
          PLATFORM_PATH="$SDK_ROOT/platforms/android-$ANDROID_API"

          echo "=========================================="
          echo "CONFIGURING ANDROID ENVIRONMENT"
          echo "=========================================="

          if [ ! -d "$NDK_PATH" ]; then
            echo "ERROR: NDK not found:"
            echo "$NDK_PATH"
            exit 1
          fi

          if [ ! -d "$BUILD_TOOLS_PATH" ]; then
            echo "ERROR: Build Tools not found:"
            echo "$BUILD_TOOLS_PATH"
            exit 1
          fi

          if [ ! -d "$PLATFORM_PATH" ]; then
            echo "ERROR: Android API $ANDROID_API not found."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "ANDROID_NDK=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"

          echo "ANDROIDAPI=$ANDROID_API" >> "$GITHUB_ENV"
          echo "ANDROIDMINAPI=$ANDROID_MIN_API" >> "$GITHUB_ENV"

          echo "ANDROIDSDK=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROIDNDK=$NDK_PATH" >> "$GITHUB_ENV"

          echo "$BUILD_TOOLS_PATH" >> "$GITHUB_PATH"
          echo "$NDK_PATH" >> "$GITHUB_PATH"

          echo ""
          echo "Android environment configured."

      # ==========================================================
      # 12. FINAL ANDROID TOOLCHAIN CHECK
      # ==========================================================
      - name: Final Android toolchain check
        shell: bash
        run: |
          set -e

          SDK_ROOT="$ANDROID_HOME"
          NDK_PATH="$ANDROID_NDK_HOME"

          echo "=========================================="
          echo "FINAL ANDROID TOOLCHAIN CHECK"
          echo "=========================================="

          echo ""
          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "ANDROID_NDK:"
          echo "$ANDROID_NDK"

          echo ""
          echo "ANDROID_NDK_HOME:"
          echo "$ANDROID_NDK_HOME"

          echo ""
          echo "AIDL:"
          command -v aidl
          aidl --help >/dev/null 2>&1 || true

          echo ""
          echo "SDKMANAGER:"
          command -v sdkmanager
          sdkmanager --version

          echo ""
          echo "ADB:"
          ADB="$SDK_ROOT/platform-tools/adb"

          if [ ! -x "$ADB" ]; then
               echo "ERROR: ADB was not found at:"
               echo "$ADB"
               echo ""
               echo "Platform-tools contents:"
               find "$SDK_ROOT/platform-tools" -maxdepth 2 -type f | sort
               exit 1
          fi

          echo "ADB found:"
          echo "$ADB"

          "$ADB" version

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          export PATH="$SDK_ROOT/platform-tools:$PATH"

          echo ""
          echo "NDK:"
          test -f "$NDK_PATH/ndk-build"
          "$NDK_PATH/ndk-build" --version || true

          echo ""
          echo "Android platform:"
          test -d "$SDK_ROOT/platforms/android-$ANDROID_API"

          echo ""
          echo "Build Tools:"
          test -f "$SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/aidl"

          echo ""
          echo "=========================================="
          echo "ANDROID TOOLCHAIN READY"
          echo "=========================================="

      # ==========================================================
      # 13. INSTALL BUILDOZER
      # ==========================================================
      - name: Install Buildozer
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install \
            "cython==0.29.33" \
            "buildozer==1.4.0"

          echo ""
          echo "=========================================="
          echo "BUILDOZER"
          echo "=========================================="

          python --version
          buildozer --version
          java -version

      # ==========================================================
      # 14. VALIDATE BUILDOZER SPEC
      # ==========================================================
      - name: Validate buildozer.spec
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "=========================================="
          echo "CHECKMATE BUILDOZER CONFIG"
          echo "=========================================="

          cat buildozer.spec

          echo ""
          echo "=========================================="
          echo "CHECKING FOR OLD NDK OVERRIDES"
          echo "=========================================="

          if grep -nE "^[[:space:]]*android\.ndk[[:space:]]*=|^[[:space:]]*android\.ndk_path[[:space:]]*=" buildozer.spec; then
            echo ""
            echo "ERROR: buildozer.spec contains an explicit NDK override."
            echo "Remove android.ndk and android.ndk_path."
            exit 1
          fi

          echo "No obsolete NDK override found."

      # ==========================================================
      # 15. DESTROY ALL OLD BUILDOZER DATA
      # ==========================================================
      - name: Clean all Buildozer caches
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CLEANING BUILDOZER"
          echo "=========================================="

          rm -rf "$HOME/.buildozer"
          rm -rf "$PROJECT_DIR/.buildozer"
          rm -rf "$PROJECT_DIR/bin"

          echo ""
          echo "Searching for stale Buildozer NDK..."

          if find "$HOME/.buildozer" \
            -type d \
            -name "*android-ndk-r23b*" \
            2>/dev/null | grep -q .; then

            echo "ERROR: stale NDK r23b still exists."
            exit 1
          fi

          echo ""
          echo "Buildozer cache completely cleaned."

      # ==========================================================
      # 16. BUILD CHECKMATE
      # ==========================================================
      - name: Build CHECKMATE APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        timeout-minutes: 90
        run: |
          set -e

          echo "=========================================="
          echo "       CHECKMATE ANDROID BUILD"
          echo "=========================================="

          echo ""
          echo "Project:"
          pwd

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo ""
          echo "Android NDK:"
          echo "$ANDROID_NDK_HOME"

          echo ""
          echo "AIDL:"
          command -v aidl
          aidl --version

          echo ""
          echo "=========================================="
          echo "STARTING BUILDOZER"
          echo "=========================================="

          buildozer android debug

      # ==========================================================
      # 17. VERIFY APK
      # ==========================================================
      - name: Verify generated APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CHECKMATE APK"
          echo "=========================================="

          echo "Searching for APK..."

          find "$PROJECT_DIR/bin" \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find "$PROJECT_DIR/bin" \
            -type f \
            -name "*.apk" \
            | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo ""
            echo "ERROR: Build completed but no APK was found."
            exit 1
          fi

          echo ""
          echo "APK COUNT:"
          echo "$APK_COUNT"

          echo ""
          echo "CHECKMATE APK FOUND."

      # ==========================================================
      # 18. UPLOAD APK
      # ==========================================================
      - name: Upload CHECKMATE APK
        uses: actions/upload-artifact@v4
        with:
          name: CHECKMATE-APK
          path: ${{ env.PROJECT_DIR }}/bin/*.apk
          if-no-files-found: error

      # ==========================================================
      # 19. BUILD SUMMARY
      # ==========================================================
      - name: Build success summary
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "          CHECKMATE BUILD SUCCESS"
          echo "=========================================="
          echo ""
          echo "APK successfully generated."
          echo "Open the Actions run and download:"
          echo ""
          echo "CHECKMATE-APK"
          echo ""
          echo "=========================================="
