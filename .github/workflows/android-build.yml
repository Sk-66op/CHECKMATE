name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build APK
        uses: B00TK1D/android-build-action@v1
        with:
          python-version: '3.9'
          requirements: kivy==2.1.0,kivymd==1.1.1,chess==1.10.0,pillow
          package-name: checkmate
          app-name: Checkmate
          android-api: 30
          android-min-api: 21
          android-ndk: 23b
