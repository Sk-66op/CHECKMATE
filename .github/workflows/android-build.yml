name: Build ChessAI Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            libsqlite3-dev \
            zlib1g-dev \
            libbz2-dev \
            libreadline-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libjpeg-dev \
            libfreetype6-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer
          pip install "Cython==0.29.34"

      - name: Set project directory
        run: |
          echo "PROJECT_DIR=ChessAI_CHECKMATE_resolved/ChessAI_CHECKMATE_resolved/ChessAI" >> "$GITHUB_ENV"

      - name: Verify project
        run: |
          echo "Project:"
          pwd
          echo ""
          echo "Files:"
          ls -la "$PROJECT_DIR"
          echo ""
          echo "Checking buildozer.spec..."
          test -f "$PROJECT_DIR/buildozer.spec"
          echo "buildozer.spec FOUND!"

      - name: Clean previous build
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          BUILDOZER_WARN_ON_ROOT: "1"
        run: |
          buildozer android debug

      - name: Show APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "===== APK ====="
          ls -lah bin/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessAI-APK
          path: ${{ env.PROJECT_DIR }}/bin/*.apk
          if-no-files-found: error

      - name: Upload build logs if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ChessAI-Build-Logs
          path: |
            ${{ env.PROJECT_DIR }}/.buildozer/
          if-no-files-found: ignore
