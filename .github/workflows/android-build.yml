name: Build CHECKMATE Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. EXTRACT PROJECT
      # ==========================================
      - name: Extract CHECKMATE project
        shell: bash
        run: |
          set -e

          echo "=== Repository ==="
          ls -la

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1 || true)

          if [ -n "$ZIP_FILE" ]; then
            echo "Found project ZIP:"
            echo "$ZIP_FILE"

            rm -rf extracted
            mkdir -p extracted

            unzip -o "$ZIP_FILE" -d extracted
          else
            echo "No ZIP found."
          fi

      # ==========================================
      # 3. FIND BUILDOZER PROJECT
      # ==========================================
      - name: Locate CHECKMATE project
        shell: bash
        run: |
          set -e

          SPEC=$(find . \
            -type f \
            -name "buildozer.spec" \
            -not -path "*/.buildozer/*" \
            -not -path "*/.venv/*" \
            | head -n 1)

          if [ -z "$SPEC" ]; then
            echo "ERROR: buildozer.spec not found."
            find . -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SPEC")
          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "Found project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "=== Project ==="
          ls -la "$PROJECT_DIR"

      # ==========================================
      # 4. CLEAN PROJECT
      # ==========================================
      - name: Clean project
        shell: bash
        run: |
          set -e

          echo "Cleaning project..."

          rm -rf "$PROJECT_DIR/.venv"
          rm -rf "$PROJECT_DIR/venv"
          rm -rf "$PROJECT_DIR/.buildozer"
          rm -rf "$PROJECT_DIR/bin"

          find "$PROJECT_DIR" \
            -type d \
            -name "__pycache__" \
            -prune \
            -exec rm -rf {} +

          echo "Project cleaned."

      # ==========================================
      # 5. PYTHON 3.10
      # ==========================================
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ==========================================
      # 6. JAVA 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================
      # 7. SYSTEM DEPENDENCIES
      # ==========================================
      - name: Install system dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential

      # ==========================================
      # 8. SETUP ANDROID SDK / NDK
      # ==========================================
      - name: Setup Android SDK and NDK
        shell: bash
        run: |
          set -e

          SDK_ROOT="$ANDROID_HOME"

          echo "Android SDK:"
          echo "$SDK_ROOT"

          echo "Installing Android SDK components..."

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-31" \
            "build-tools;35.0.0" \
            "ndk;25.2.9519653"

          echo ""
          echo "=== Installed NDKs ==="
          ls -la "$SDK_ROOT/ndk" || true

          echo ""
          echo "=== Selected NDK ==="

          NDK_PATH="$SDK_ROOT/ndk/25.2.9519653"

          if [ ! -d "$NDK_PATH" ]; then
            echo "ERROR: NDK 25.2.9519653 was not installed."
            exit 1
          fi

          echo "NDK_PATH=$NDK_PATH"

          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK_PATH" >> "$GITHUB_ENV"

      # ==========================================
      # 9. VERIFY ANDROID ENVIRONMENT
      # ==========================================
      - name: Verify Android environment
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID ENVIRONMENT"
          echo "=========================================="

          echo "ANDROID_HOME:"
          echo "$ANDROID_HOME"

          echo ""
          echo "ANDROID_SDK_ROOT:"
          echo "$ANDROID_SDK_ROOT"

          echo ""
          echo "ANDROID_NDK:"
          echo "$ANDROID_NDK"

          echo ""
          echo "ANDROID_NDK_HOME:"
          echo "$ANDROID_NDK_HOME"

          echo ""
          echo "NDK version:"
          "$ANDROID_NDK_HOME/ndk-build" --version || true

          echo ""
          echo "Installed SDK packages:"
          sdkmanager --list_installed | grep -E \
            "platforms;android-31|build-tools;35.0.0|ndk;25.2.9519653" || true

      # ==========================================
      # 10. INSTALL BUILDOZER
      # ==========================================
      - name: Install Buildozer
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "cython==0.29.33" \
            "buildozer==1.4.0"

          echo ""
          echo "=== Build tools ==="

          python --version
          java -version
          buildozer --version

      # ==========================================
      # 11. CHECK BUILDOZER CONFIG
      # ==========================================
      - name: Check buildozer.spec
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "=========================================="
          echo "CHECKMATE BUILDOZER CONFIG"
          echo "=========================================="

          cat buildozer.spec

          echo ""
          echo "=========================================="
          echo "CHECKING FOR OLD NDK SETTINGS"
          echo "=========================================="

          if grep -nE "android\.ndk[ _]?=|android\.ndk_path" buildozer.spec; then
            echo ""
            echo "ERROR: Old/custom NDK setting detected."
            echo "Remove android.ndk / android.ndk_path from buildozer.spec."
            exit 1
          fi

          echo "No old NDK override detected."

      # ==========================================
      # 12. FORCE CLEAN BUILDOZER ENVIRONMENT
      # ==========================================
      - name: Clean Buildozer environment
        shell: bash
        run: |
          set -e

          echo "Removing ALL old Buildozer Android data..."

          rm -rf "$HOME/.buildozer"
          rm -rf "$PROJECT_DIR/.buildozer"
          rm -rf "$PROJECT_DIR/bin"

          echo ""
          echo "Checking that old Buildozer NDK is gone..."

          if [ -d "$HOME/.buildozer/android/platform/android-ndk-r23b" ]; then
            echo "ERROR: Old NDK r23b still exists."
            exit 1
          fi

          echo "Buildozer environment cleaned."

      # ==========================================
      # 13. BUILD CHECKMATE
      # ==========================================
      - name: Build CHECKMATE
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        timeout-minutes: 90
        run: |
          set -e

          echo "=========================================="
          echo "       CHECKMATE ANDROID BUILD"
          echo "=========================================="

          echo ""
          echo "Project:"
          pwd

          echo ""
          echo "Python:"
          python --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Buildozer:"
          buildozer --version

          echo ""
          echo "Android NDK:"
          echo "$ANDROID_NDK_HOME"

          echo ""
          echo "Starting Buildozer..."

          buildozer android debug

      # ==========================================
      # 14. FIND APK
      # ==========================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "GENERATED APK"
          echo "=========================================="

          find "$PROJECT_DIR/bin" \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find "$PROJECT_DIR/bin" \
            -type f \
            -name "*.apk" \
            | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo ""
          echo "CHECKMATE APK generated successfully."

      # ==========================================
      # 15. UPLOAD APK
      # ==========================================
      - name: Upload CHECKMATE APK
        uses: actions/upload-artifact@v4
        with:
          name: CHECKMATE-APK
          path: ${{ env.PROJECT_DIR }}/bin/*.apk
          if-no-files-found: error
