name: Build ChessAI Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ChessAI source
        run: |
          echo "Extracting ChessAI project..."

          unzip -o ChessAI_CHECKMATE.zip

          echo "Contents after extraction:"
          ls -la
          ls -la ChessAI_CHECKMATE

          rm -rf ChessAI
          mv ChessAI_CHECKMATE/ChessAI ChessAI

          echo "ChessAI directory:"
          ls -la ChessAI

          test -f ChessAI/buildozer.spec

          echo "Configuring Buildozer..."

          sed -i '/^\[app\]/a android.accept_sdk_license = True' ChessAI/buildozer.spec

          # Force Python-for-Android to use the Python 3.11-compatible
          # v2024.01.21 release directly.
          sed -i '/^p4a\.branch[[:space:]]*=/d' ChessAI/buildozer.spec
          sed -i '/^p4a\.commit[[:space:]]*=/d' ChessAI/buildozer.spec
          sed -i '/^android\.pythonVersion[[:space:]]*=/d' ChessAI/buildozer.spec

          # Insert directly under [app] so buildozer actually reads them
          # (appending to end-of-file would land under [buildozer] and be ignored)
          sed -i '/^\[app\]/a p4a.branch = v2024.01.21\np4a.commit = HEAD' ChessAI/buildozer.spec

          echo "Final Buildozer configuration:"
          grep -E "requirements|p4a.branch|p4a.commit|android.api|android.minapi|android.ndk|android.archs|android.accept_sdk_license|android.pythonVersion" ChessAI/buildozer.spec || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

          echo "ANDROIDSDK=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/33.0.2" >> "$GITHUB_PATH"

          test -x "$ANDROID_HOME/build-tools/33.0.2/aidl"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer
          pip install "cython==0.29.34"

      - name: Verify Build Environment
        run: |
          java -version
          python --version
          pip --version
          buildozer --version
          echo "$ANDROID_HOME"

          "$ANDROID_HOME/build-tools/33.0.2/aidl" 2>&1 | head -20 || true

      - name: Verify ChessAI project
        working-directory: ChessAI
        run: |
          ls -la

          echo "Requirements:"
          grep "^requirements" buildozer.spec || true

          echo "Android configuration:"
          grep -E "^android\.(api|minapi|ndk|archs|enable_androidx)" buildozer.spec || true

          echo "Python-for-Android configuration:"
          grep -E "^p4a\.(branch|commit|source_dir)" buildozer.spec || true

          echo "Python version override:"
          grep "^android\.pythonVersion" buildozer.spec || true

          echo "Python files:"
          find . -maxdepth 2 -name "*.py" -type f | head -30

      - name: Clean previous Android build
        working-directory: ChessAI
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Verify Python-for-Android version
        working-directory: ChessAI
        run: |
          echo "Python-for-Android will be pinned to:"
          grep -E "^p4a\.(branch|commit)" buildozer.spec

          # Confirm the pin actually landed inside [app], not [buildozer]
          awk '/^\[app\]/{f=1} /^\[buildozer\]/{f=0} f && /^p4a\.branch/{found=1} END{exit !found}' buildozer.spec

          test "$(grep '^p4a.branch' buildozer.spec | awk '{print $3}')" = "v2024.01.21"
          test "$(grep '^p4a.commit' buildozer.spec | awk '{print $3}')" = "HEAD"

      - name: Build APK
        working-directory: ChessAI
        run: |
          export ANDROIDSDK="$ANDROID_HOME"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/33.0.2:$PATH"

          buildozer android debug

      - name: List generated APK
        if: success()
        working-directory: ChessAI
        run: |
          ls -lah bin/

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ChessAI-debug-APK
          path: ChessAI/bin/*.apk
          if-no-files-found: error
