name: Build ChessAI Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository structure
        run: |
          echo "===== CURRENT DIRECTORY ====="
          pwd

          echo ""
          echo "===== REPOSITORY FILES ====="
          find . -maxdepth 5 -type f | sort

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            libsqlite3-dev \
            zlib1g-dev \
            libbz2-dev \
            libreadline-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libjpeg-dev \
            libfreetype6-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer
          pip install "Cython==0.29.34"

      - name: Find Buildozer project
        id: project
        shell: bash
        run: |
          echo "===== SEARCHING FOR BUILDOZER.SPEC ====="

          SPEC=$(find . -type f -name "buildozer.spec" -print -quit)

          if [ -z "$SPEC" ]; then
            echo "ERROR: buildozer.spec was NOT found."
            echo ""
            echo "===== ALL FILES ====="
            find . -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SPEC")

          echo "Buildozer spec found:"
          echo "$SPEC"

          echo ""
          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Verify project
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          echo "===== PROJECT DIRECTORY ====="
          pwd

          echo ""
          echo "===== PROJECT FILES ====="
          find . -maxdepth 3 -type f | sort

          echo ""
          echo "===== REQUIRED FILE CHECK ====="

          if [ ! -f "main.py" ]; then
            echo "ERROR: main.py not found!"
            exit 1
          fi

          if [ ! -f "buildozer.spec" ]; then
            echo "ERROR: buildozer.spec not found!"
            exit 1
          fi

          echo "main.py: FOUND"
          echo "buildozer.spec: FOUND"

      - name: Clean previous build
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        env:
          BUILDOZER_WARN_ON_ROOT: "1"
        run: |
          buildozer android debug

      - name: Check APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          echo "===== BIN DIRECTORY ====="
          ls -lah bin/

          echo ""
          echo "===== GENERATED APK ====="
          find bin -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessAI-APK
          path: ${{ steps.project.outputs.project_dir }}/bin/*.apk
          if-no-files-found: error

      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ChessAI-Build-Logs
          path: |
            ${{ steps.project.outputs.project_dir }}/.buildozer/
          if-no-files-found: ignore
