name: Build Checkmate Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "ChessAI/**"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    name: Build Checkmate APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug - Show structure
        run: |
          echo "Current directory: $(pwd)"
          echo "Root contents:"
          ls -la
          echo ""
          echo "ChessAI contents:"
          if [ -d "ChessAI" ]; then
            ls -la ChessAI/
          else
            echo "❌ ChessAI directory not found!"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            autopoint \
            openjdk-17-jdk \
            python3-dev \
            build-essential

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython

      - name: Verify buildozer.spec
        run: |
          cd ChessAI
          echo "In ChessAI directory: $(pwd)"
          echo "Files:"
          ls -la
          echo ""
          if [ -f "buildozer.spec" ]; then
            echo "✅ buildozer.spec found!"
          else
            echo "❌ buildozer.spec NOT found!"
            exit 1
          fi

      - name: Build Checkmate APK
        run: |
          cd ChessAI
          buildozer -v android debug
        timeout-minutes: 45

      - name: Verify APK
        run: |
          if [ -f "ChessAI/bin/checkmate-1.0-arm64-v8a-debug.apk" ] || [ -n "$(find ChessAI/bin -name '*.apk' 2>/dev/null)" ]; then
            echo "✅ APK found!"
            ls -lh ChessAI/bin/*.apk
          else
            echo "❌ No APK found!"
            ls -la ChessAI/bin/ || echo "bin directory doesn't exist"
            exit 1
          fi

      - name: Upload Checkmate APK
        uses: actions/upload-artifact@v4
        with:
          name: Checkmate-debug-apk
          path: ChessAI/bin/*.apk
          if-no-files-found: error
