name: Build Checkmate Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "ChessAI/**"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    name: Build Checkmate APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug - Show structure
        run: |
          echo "Current directory: $(pwd)"
          echo "Contents:"
          ls -la
          echo "ChessAI contents:"
          ls -la ChessAI/ || echo "ChessAI directory not found!"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            autopoint \
            openjdk-17-jdk \
            python3-dev

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.5.0 cython==0.29.34

      - name: Show project files (in ChessAI)
        working-directory: ChessAI
        run: |
          echo "Current directory: $(pwd)"
          echo "Project files:"
          ls -la
          echo ""
          echo "Checking buildozer.spec:"
          if [ -f "buildozer.spec" ]; then
            echo "✅ buildozer.spec found!"
            cat buildozer.spec | head -20
          else
            echo "❌ buildozer.spec NOT found!"
            exit 1
          fi

      - name: Build Checkmate APK
        working-directory: ChessAI
        run: |
          buildozer -v android debug
        timeout-minutes: 30

      - name: Verify APK
        working-directory: ChessAI
        run: |
          echo "APK files:"
          ls -lh bin/ || echo "No bin directory yet!"
          if [ -d "bin" ]; then
            find bin -name "*.apk" -exec ls -lh {} \;
            test -n "$(find bin -name '*.apk' -print -quit)" || echo "No APK found!"
          fi

      - name: Upload Checkmate APK
        uses: actions/upload-artifact@v4
        with:
          name: Checkmate-debug-apk
          path: ChessAI/bin/*.apk
          if-no-files-found: error
