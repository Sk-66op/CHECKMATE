name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -o *.zip
          fi
          if [ -d "CHECKMATE/ChessAI" ]; then
            cp -r CHECKMATE/ChessAI/* .
          fi
          ls -la

      - name: Install Cython
        run: |
          pip install --upgrade pip
          pip install cython==0.29.33

      - name: Install Java 17 and AIDL
        run: |
          apt-get update
          apt-get install -y wget unzip openjdk-17-jdk
          
          export ANDROID_HOME=/android
          export ANDROID_SDK_ROOT=/android
          mkdir -p $ANDROID_HOME
          
          cd $ANDROID_HOME
          
          # Download SDK tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          rm commandlinetools-linux-11076708_latest.zip
          
          # Setup structure
          mkdir -p cmdline-tools
          mv cmdline-tools cmdline-tools/latest 2>/dev/null || true
          
          if [ ! -f "cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p cmdline-tools/latest
            mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
          fi
          
          # Accept licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          
          # Install build tools
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3"
          
          # Set environment
          echo "ANDROID_HOME=/android" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/android" >> $GITHUB_ENV
          echo "/android/build-tools/30.0.3" >> $GITHUB_PATH
          
          echo "✅ AIDL installed"

      - name: Create buildozer.spec
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = Checkmate
          package.name = checkmate
          package.domain = org.miniproject
          source.dir = .
          source.include_exts = py,png,jpg,jpeg,kv,atlas,json,ttf
          version = 1.0
          requirements = python3,kivy==2.0.0,kivymd==1.0.0,chess==1.10.0,pillow
          orientation = portrait
          fullscreen = 0
          android.permissions = INTERNET
          android.api = 30
          android.minapi = 21
          android.ndk = 23b
          android.archs = arm64-v8a, armeabi-v7a
          android.allow_backup = True
          android.enable_androidx = True
          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOF

      - name: Build APK
        run: |
          export ANDROID_HOME=/android
          export ANDROID_SDK_ROOT=/android
          buildozer android debug
        timeout-minutes: 60

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Checkmate-APK
          path: bin/*.apk
