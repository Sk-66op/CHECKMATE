name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -o *.zip
          fi
          if [ -d "CHECKMATE/ChessAI" ]; then
            cp -r CHECKMATE/ChessAI/* .
          fi
          ls -la

      - name: Install Cython
        run: |
          pip install --upgrade pip
          pip install cython==0.29.33

      - name: Install Android SDK with AIDL
        run: |
          # Install Java 17 first
          apt-get update
          apt-get install -y openjdk-17-jdk wget unzip
          
          export ANDROID_HOME=/android-sdk
          export ANDROID_SDK_ROOT=/android-sdk
          mkdir -p $ANDROID_HOME
          
          cd $ANDROID_HOME
          
          # Download command-line tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          rm commandlinetools-linux-11076708_latest.zip
          
          # Create correct directory structure
          mkdir -p cmdline-tools
          mv cmdline-tools cmdline-tools/latest 2>/dev/null || true
          
          if [ ! -f "cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p cmdline-tools/latest
            mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
          fi
          
          # Accept licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          
          # Install ONLY build-tools 30.0.3 (which has AIDL)
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;30.0.3" "platforms;android-30" "platform-tools"
          
          # Set environment variables
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "PATH=$ANDROID_HOME/build-tools/30.0.3:$PATH" >> $GITHUB_ENV
          echo "PATH=$ANDROID_HOME/platform-tools:$PATH" >> $GITHUB_ENV
          
          # Verify AIDL exists
          if [ -f "$ANDROID_HOME/build-tools/30.0.3/aidl" ]; then
            echo "✅ AIDL found at $ANDROID_HOME/build-tools/30.0.3/aidl"
            chmod +x $ANDROID_HOME/build-tools/30.0.3/aidl
            ln -sf $ANDROID_HOME/build-tools/30.0.3/aidl /usr/local/bin/aidl
          fi
          
          echo "✅ Android SDK installed with AIDL"

      - name: Create buildozer.spec (Forces SDK path)
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = Checkmate
          package.name = checkmate
          package.domain = org.miniproject
          
          source.dir = .
          source.include_exts = py,png,jpg,jpeg,kv,atlas,json,ttf
          
          version = 1.0
          requirements = python3,kivy==2.1.0,kivymd==1.1.1,chess==1.10.0,pillow
          
          orientation = portrait
          fullscreen = 0
          
          android.permissions = INTERNET
          android.api = 30
          android.minapi = 21
          android.ndk = 23b
          android.archs = arm64-v8a
          android.allow_backup = True
          android.enable_androidx = True
          
          # Force SDK path - THIS IS CRITICAL
          android.sdk_path = /android-sdk
          android.ndk_path = /android-sdk/ndk/23b
          
          [buildozer]
          log_level = 2
          warn_on_root = 0
          EOF

      - name: Build APK
        run: |
          export ANDROID_HOME=/android-sdk
          export ANDROID_SDK_ROOT=/android-sdk
          export PATH=/android-sdk/build-tools/30.0.3:$PATH
          
          # Verify AIDL is accessible
          echo "=== AIDL Location ==="
          which aidl || echo "AIDL not in PATH"
          ls -la /android-sdk/build-tools/30.0.3/aidl
          
          # Build
          buildozer android debug
        timeout-minutes: 60

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Checkmate-APK
          path: bin/*.apk
