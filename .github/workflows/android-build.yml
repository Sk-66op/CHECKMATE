name: Build ChessAI Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ChessAI source
        run: |
          echo "Extracting ChessAI project..."

          unzip -o ChessAI_CHECKMATE_resolved.zip

          echo "Contents after extraction:"
          ls -la
          ls -la ChessAI_CHECKMATE_resolved

          # The ZIP contains:
          # ChessAI_CHECKMATE_resolved/ChessAI/
          # Move ChessAI to the location expected by Buildozer.

          rm -rf ChessAI

          mv ChessAI_CHECKMATE_resolved/ChessAI ChessAI

          echo "ChessAI directory:"
          ls -la ChessAI

          echo "Checking buildozer.spec..."
          test -f ChessAI/buildozer.spec

          echo "Configuring Buildozer..."

          sed -i '/^\[app\]/a android.accept_sdk_license = True' ChessAI/buildozer.spec

          echo "Final Buildozer configuration:"
          grep -E "requirements|p4a.branch|android.api|android.minapi|android.ndk|android.archs|android.accept_sdk_license" ChessAI/buildozer.spec || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK tools
        run: |
          echo "Accepting Android SDK licenses..."

          yes | sdkmanager --licenses >/dev/null || true

          echo "Installing Android SDK components..."

          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

          echo "ANDROIDSDK=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/33.0.2" >> "$GITHUB_PATH"

          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo "Checking AIDL..."

          test -x "$ANDROID_HOME/build-tools/33.0.2/aidl"

          echo "AIDL found successfully!"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip

          pip install buildozer

          pip install "cython<"3.1"

      - name: Verify Build Environment
        run: |
          echo "======================================"
          echo "Java:"
          java -version

          echo "======================================"
          echo "Python:"
          python --version

          echo "======================================"
          echo "Pip:"
          pip --version

          echo "======================================"
          echo "Buildozer:"
          buildozer --version

          echo "======================================"
          echo "Android SDK:"
          echo "$ANDROID_HOME"

          echo "======================================"
          echo "AIDL:"
          "$ANDROID_HOME/build-tools/33.0.2/aidl" 2>&1 | head -20 || true

          echo "======================================"
          echo "Build environment verified."

      - name: Verify ChessAI project
        working-directory: ChessAI
        run: |
          echo "ChessAI project contents:"
          ls -la

          echo "======================================"
          echo "buildozer.spec requirements:"
          grep "^requirements" buildozer.spec || true

          echo "======================================"
          echo "Android configuration:"
          grep -E "^android\.(api|minapi|ndk|archs|enable_androidx)" buildozer.spec || true

          echo "======================================"
          echo "Main Python files:"
          find . -maxdepth 2 -name "*.py" -type f | head -30

      - name: Clean previous Android build
        working-directory: ChessAI
        run: |
          rm -rf .buildozer
          rm -rf bin

          echo "Previous Android build files removed."

      - name: Build APK
        working-directory: ChessAI
        run: |
          export ANDROIDSDK="$ANDROID_HOME"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/33.0.2:$PATH"

          echo "======================================"
          echo "Starting Buildozer Android build..."
          echo "======================================"

          buildozer android debug

      - name: List generated APK
        if: success()
        working-directory: ChessAI
        run: |
          echo "======================================"
          echo "Build completed successfully!"
          echo "======================================"

          echo "Generated APK files:"
          ls -lah bin/

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ChessAI-debug-APK
          path: ChessAI/bin/*.apk
          if-no-files-found: error