name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -o *.zip
          fi
          if [ -d "CHECKMATE/ChessAI" ]; then
            cp -r CHECKMATE/ChessAI/* .
          fi
          ls -la

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            openjdk-11-jdk python3-dev \
            build-essential wget

      - name: Install Python Packages
        run: |
          pip install --upgrade pip
          pip install cython==0.29.33
          pip install buildozer==1.4.0

      - name: MANUAL AIDL INSTALLATION
        run: |
          echo "=== Installing Android SDK with AIDL ==="
          
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p $ANDROID_HOME
          
          cd $ANDROID_HOME
          
          # Download command-line tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          rm commandlinetools-linux-11076708_latest.zip
          
          # Setup directory structure
          mkdir -p cmdline-tools
          mv cmdline-tools cmdline-tools/latest 2>/dev/null || true
          
          if [ ! -f "cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p cmdline-tools/latest
            mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
          fi
          
          # Accept licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          
          # Install build tools 30.0.3 (contains AIDL)
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-30" "build-tools;30.0.3"
          
          # Create symlink for AIDL
          if [ -f "$ANDROID_HOME/build-tools/30.0.3/aidl" ]; then
            sudo ln -sf $ANDROID_HOME/build-tools/30.0.3/aidl /usr/local/bin/aidl
            echo "✅ AIDL symlink created at /usr/local/bin/aidl"
          fi
          
          # Also copy to standard location
          if [ -f "$ANDROID_HOME/build-tools/30.0.3/aidl" ]; then
            sudo cp $ANDROID_HOME/build-tools/30.0.3/aidl /usr/bin/aidl
            echo "✅ AIDL copied to /usr/bin/aidl"
          fi
          
          # Verify
          echo ""
          echo "=== AIDL Verification ==="
          ls -la $ANDROID_HOME/build-tools/30.0.3/aidl || echo "AIDL not found in build-tools"
          which aidl || echo "AIDL not in PATH"
          aidl --version 2>/dev/null || echo "AIDL installed but may not have version flag"
          
          # Set environment
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/build-tools/30.0.3" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          
          echo "✅ Android SDK with AIDL installed successfully"

      - name: Create buildozer.spec
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = Checkmate
          package.name = checkmate
          package.domain = org.miniproject
          source.dir = .
          source.include_exts = py,png,jpg,jpeg,kv,atlas,json,ttf
          version = 1.0
          requirements = python3,kivy==2.0.0,kivymd==1.0.0,chess==1.10.0,pillow
          orientation = portrait
          fullscreen = 0
          android.permissions = INTERNET
          android.api = 30
          android.minapi = 21
          android.ndk = 23b
          android.archs = arm64-v8a, armeabi-v7a
          android.allow_backup = True
          android.enable_androidx = True
          android.sdk_path = $HOME/android-sdk
          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF

      - name: Build APK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$ANDROID_HOME/build-tools/30.0.3:$PATH
          
          echo "=== PATH contains AIDL ==="
          which aidl
          
          echo "y" | buildozer android debug
        timeout-minutes: 60

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Checkmate-APK
          path: bin/*.apk
