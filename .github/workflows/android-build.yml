name: Build Android APK (Fixed)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            openjdk-11-jdk python3-dev \
            build-essential wget

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer==1.4.0

      - name: Create clean buildozer.spec
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = Checkmate
          package.name = checkmate
          package.domain = org.miniproject
          source.dir = .
          source.include_exts = py,png,jpg,jpeg,kv,atlas,json
          version = 1.0
          requirements = python3,kivy==2.0.0,kivymd==1.0.0,chess==1.10.0,pillow
          orientation = portrait
          fullscreen = 0
          android.permissions = INTERNET
          android.api = 29
          android.minapi = 21
          android.ndk = 21d
          android.archs = armeabi-v7a
          android.allow_backup = True
          android.enable_androidx = True
          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF

      - name: Build APK
        run: |
          buildozer android debug
        timeout-minutes: 45

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Checkmate-APK
          path: bin/*.apk
