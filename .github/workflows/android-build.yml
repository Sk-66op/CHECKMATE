name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -o *.zip
          fi
          if [ -d "CHECKMATE/ChessAI" ]; then
            cp -r CHECKMATE/ChessAI/* .
          fi
          ls -la

      - name: Setup Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            openjdk-17-jdk python3-dev \
            build-essential wget

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install cython==0.29.33
          python -m pip install buildozer==1.4.0

      - name: Install Android SDK with AIDL (MANUAL FORCE)
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p $ANDROID_HOME
          
          cd $ANDROID_HOME
          
          # Download command-line tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools-linux-9477386_latest.zip
          rm commandlinetools-linux-9477386_latest.zip
          
          # Create correct directory structure
          mkdir -p cmdline-tools
          mv cmdline-tools cmdline-tools/latest 2>/dev/null || true
          
          if [ ! -f "cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p cmdline-tools/latest
            mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
          fi
          
          # Accept licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          
          # Install build-tools with AIDL
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;30.0.3" "platforms;android-30" "platform-tools"
          
          # Force symlink for AIDL
          if [ -f "$ANDROID_HOME/build-tools/30.0.3/aidl" ]; then
            sudo ln -sf $ANDROID_HOME/build-tools/30.0.3/aidl /usr/bin/aidl
            sudo ln -sf $ANDROID_HOME/build-tools/30.0.3/aidl /usr/local/bin/aidl
            echo "✅ AIDL installed at /usr/bin/aidl"
          fi
          
          # Verify
          echo "AIDL location:"
          which aidl || echo "AIDL not in PATH"
          ls -la $ANDROID_HOME/build-tools/30.0.3/aidl || echo "AIDL not found"
          
          # Set environment
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/build-tools/30.0.3" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Create buildozer.spec
        run: |
          cat > buildozer.spec << 'EOF'
          [app]
          title = Checkmate
          package.name = checkmate
          package.domain = org.miniproject
          
          source.dir = .
          source.include_exts = py,png,jpg,jpeg,kv,atlas,json,ttf
          
          version = 1.0
          requirements = python3,kivy==2.1.0,kivymd==1.1.1,chess==1.10.0,pillow
          
          orientation = portrait
          fullscreen = 0
          
          android.permissions = INTERNET
          android.api = 30
          android.minapi = 21
          android.ndk = 23b
          android.archs = arm64-v8a
          android.allow_backup = True
          android.enable_androidx = True
          
          # Force SDK path
          android.sdk_path = $HOME/android-sdk
          android.ndk_path = $HOME/android-sdk/ndk/23b
          
          [buildozer]
          log_level = 2
          warn_on_root = 1
          EOF

      - name: Build APK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$ANDROID_HOME/build-tools/30.0.3:$PATH
          
          echo "=== AIDL Verification ==="
          which aidl
          aidl --version 2>/dev/null || echo "AIDL exists but no version flag"
          
          echo "=== Building APK ==="
          echo "y" | python -m buildozer android debug
        timeout-minutes: 60

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Checkmate-APK
          path: bin/*.apk
