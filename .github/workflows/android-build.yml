name: Build ChessAI Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Set up Python
      # --------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --------------------------------------------------
      # 3. Install system dependencies
      # --------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libltdl-dev \
            libffi-dev \
            libssl-dev \
            libsqlite3-dev \
            zlib1g-dev \
            libbz2-dev \
            libreadline-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libjpeg-dev \
            libfreetype6-dev

      # --------------------------------------------------
      # 4. Upgrade pip tools
      # --------------------------------------------------
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      # --------------------------------------------------
      # 5. Install Buildozer + compatible Cython
      # --------------------------------------------------
      - name: Install Buildozer
        run: |
          pip install buildozer
          pip install "Cython==0.29.34"

      # --------------------------------------------------
      # 6. Find ChessAI project
      # --------------------------------------------------
      - name: Locate ChessAI project
        id: project
        shell: bash
        run: |
          SPEC=$(find . -name "buildozer.spec" -type f | head -n 1)

          if [ -z "$SPEC" ]; then
            echo "ERROR: buildozer.spec not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SPEC")

          echo "Project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # --------------------------------------------------
      # 7. Verify project
      # --------------------------------------------------
      - name: Verify project files
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          echo "===== PROJECT FILES ====="
          find . -maxdepth 3 -type f | sort

          echo ""
          echo "===== BUILD CONFIG ====="
          grep -E "^(title|package.name|package.domain|source.dir|source.include_exts|requirements|android.api|android.minapi|android.ndk|android.archs|android.accept_sdk_license)" buildozer.spec || true

      # --------------------------------------------------
      # 8. Clean old Buildozer files
      # --------------------------------------------------
      - name: Clean Buildozer
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          rm -rf .buildozer
          rm -rf bin

      # --------------------------------------------------
      # 9. Accept Android SDK licenses
      # --------------------------------------------------
      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$HOME/.buildozer/android/platform/android-sdk/licenses"

          yes | sdkmanager --licenses || true

      # --------------------------------------------------
      # 10. Build APK
      # --------------------------------------------------
      - name: Build APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        env:
          BUILDOZER_WARN_ON_ROOT: "1"
        run: |
          buildozer android debug

      # --------------------------------------------------
      # 11. Show generated APK
      # --------------------------------------------------
      - name: List APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          echo "===== GENERATED APK ====="
          ls -lah bin/

      # --------------------------------------------------
      # 12. Upload APK artifact
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessAI-APK
          path: ${{ steps.project.outputs.project_dir }}/bin/*.apk
          if-no-files-found: error

      # --------------------------------------------------
      # 13. Upload Buildozer logs if build fails
      # --------------------------------------------------
      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ChessAI-Build-Logs
          path: |
            ${{ steps.project.outputs.project_dir }}/.buildozer/android/platform/python-for-android/**/*.log
            ${{ steps.project.outputs.project_dir }}/.buildozer/android/platform/build-*/**/*.log
          if-no-files-found: ignore
