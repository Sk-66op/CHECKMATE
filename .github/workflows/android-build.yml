name: Build Checkmate Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Checkmate APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare files (extract ZIP if exists)
        run: |
          ZIP_FILE=$(find . -name "*.zip" | head -1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -o "$ZIP_FILE"
            for dir in */; do
              if [ -f "${dir}main.py" ] || [ -f "${dir}buildozer.spec" ]; then
                cp -r "${dir}"* .
              fi
            done
          fi
          find . -name "buildozer.spec"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev gettext autopoint \
            openjdk-17-jdk python3-dev build-essential

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython

      - name: Pre-accept Android SDK License
        run: |
          # This will run before Buildozer to ensure licenses are accepted
          mkdir -p ~/.android
          echo "### User accepted all Android SDK licenses" > ~/.android/repositories.cfg
          
          # Also set environment variable to skip license prompts
          echo "sdkman.auto.answer.license=yes" >> ~/.android/repositories.cfg

      - name: Build APK (with auto-accept)
        run: |
          SPEC_DIR=$(find . -name "buildozer.spec" -exec dirname {} \; | head -1)
          if [ -z "$SPEC_DIR" ]; then
            echo "❌ buildozer.spec not found!"
            exit 1
          fi
          echo "Building in: $SPEC_DIR"
          cd "$SPEC_DIR"
          
          # Build with non-interactive mode
          buildozer android debug
        timeout-minutes: 50
        env:
          # These environment variables help with non-interactive builds
          DEBIAN_FRONTEND: noninteractive
          P4A_RELEASE_KEYSTORE: /dev/null
          P4A_RELEASE_KEYSTORE_PASSWD: /dev/null
          P4A_RELEASE_KEYALIAS: /dev/null
          P4A_RELEASE_KEYALIAS_PASSWD: /dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Checkmate-debug-apk
          path: |
            **/bin/*.apk
          if-no-files-found: error
