name: Build Checkmate Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "ChessAI/**"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    name: Build Checkmate APK
    runs-on: ubuntu-22.04

    defaults:
      run:
        working-directory: ./ChessAI  # Note the ./

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            autopoint \
            openjdk-17-jdk \
            python3-dev \
            build-essential
        # Override the default - this runs in root
        working-directory: ./

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.5.0 cython==0.29.34
        # Override the default - this runs in root
        working-directory: ./

      - name: Verify ChessAI files
        run: |
          echo "Current directory: $(pwd)"
          echo "Files:"
          ls -la
          if [ ! -f "buildozer.spec" ]; then
            echo "❌ buildozer.spec not found!"
            exit 1
          fi
          echo "✅ buildozer.spec found!"

      - name: Build Checkmate APK
        run: |
          buildozer -v android debug
        timeout-minutes: 45

      - name: Upload Checkmate APK
        uses: actions/upload-artifact@v4
        with:
          name: Checkmate-debug-apk
          path: ChessAI/bin/*.apk
          if-no-files-found: error
          
