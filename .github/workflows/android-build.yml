name: Build Checkmate Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build Checkmate APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare files (extract ZIP if exists)
        run: |
          echo "=== Current structure ==="
          ls -la
          
          ZIP_FILE=$(find . -name "*.zip" | head -1)
          if [ -n "$ZIP_FILE" ]; then
            echo "✅ Found ZIP file: $ZIP_FILE"
            unzip -o "$ZIP_FILE"
            for dir in */; do
              if [ -f "${dir}main.py" ] || [ -f "${dir}buildozer.spec" ]; then
                echo "Found project files in: $dir"
                cp -r "${dir}"* .
              fi
            done
          fi
          
          echo "=== Final structure ==="
          ls -la
          echo ""
          echo "=== Checking for buildozer.spec ==="
          find . -name "buildozer.spec"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev gettext autopoint \
            openjdk-17-jdk python3-dev build-essential \
            wget

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython

      - name: Build APK
        run: |
          SPEC_DIR=$(find . -name "buildozer.spec" -exec dirname {} \; | head -1)
          if [ -z "$SPEC_DIR" ]; then
            echo "❌ buildozer.spec not found!"
            exit 1
          fi
          echo "Building in: $SPEC_DIR"
          cd "$SPEC_DIR"
          
          # Build with verbose output
          buildozer -v android debug
        timeout-minutes: 50
        env:
          # Let Buildozer handle the SDK setup
          P4A_RELEASE_KEYSTORE: /dev/null
          P4A_RELEASE_KEYSTORE_PASSWD: /dev/null
          P4A_RELEASE_KEYALIAS: /dev/null
          P4A_RELEASE_KEYALIAS_PASSWD: /dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Checkmate-debug-apk
          path: |
            **/bin/*.apk
          if-no-files-found: error
