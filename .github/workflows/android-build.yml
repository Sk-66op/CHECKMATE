name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract ZIP if exists
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -o *.zip
          fi
          if [ -d "CHECKMATE/ChessAI" ]; then
            cp -r CHECKMATE/ChessAI/* .
          fi
          ls -la

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            openjdk-17-jdk python3-dev \
            build-essential

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install cython==0.29.33
          python -m pip install buildozer==1.4.0

      - name: Verify Installation
        run: |
          python -c "import cython; print(f'Cython version: {cython.__version__}')"
          python -c "import buildozer; print(f'Buildozer version: {buildozer.__version__}')"

      - name: Initialize Buildozer
        run: |
          buildozer init 2>/dev/null || true

      - name: Build APK
        run: |
          buildozer android debug
        timeout-minutes: 60

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Checkmate-APK
          path: bin/*.apk
          if-no-files-found: error
